name: ci

run-name: "ci: ${{ github.ref_name }}"

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  #
  # The same `mise run ci` developers run locally.
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # ref: https://github.com/actions/checkout
      - uses: actions/checkout@v4

      # ref: https://github.com/jdx/mise-action
      - uses: jdx/mise-action@v4
        with:
          experimental: true

      - run: mise run ci
