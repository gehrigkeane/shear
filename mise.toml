[settings]
# Gradle tasks share one project lock; running `ci`'s dependencies concurrently only makes daemons queue.
jobs = 1

[tools]
# AGP 9 requires JDK 17+; 25 is the current LTS and Gradle 9.1+ runs on it. mise exports JAVA_HOME, which Gradle honors.
java = "temurin-25"
# Android command-line tools. The plugin exports ANDROID_HOME and puts sdkmanager, adb, and emulator on PATH, so
# Gradle needs no local.properties. `mise run sdk` installs the platform pieces a build needs.
android-sdk = "23.0"
# Repo-wide file linters: markdown, TOML, GitHub workflows, spelling.
rumdl = "latest"
taplo = "latest"
actionlint = "latest"
typos = "latest"

# `android sdk` is the successor to the deprecated sdkmanager and ships in cmdline-tools 23+. `yes` answers any
# license prompt so the task also runs unattended in CI.
[tasks.sdk]
description = "Install SDK platform 37.2, build-tools, and platform-tools (what a build needs, also run in CI)"
run = "yes | android sdk install platforms/android-37.2 build-tools/37.0.0 platform-tools"

[tasks.sdk-emulator]
description = "Install the emulator and the arm64 API 37 system image (local only)"
depends = ["sdk"]
run = "yes | android sdk install emulator system-images/android-37.0/google_apis/arm64-v8a"

# `android emulator create` only takes a device profile and picks its own system image, so creation stays on
# avdmanager, which pins the API 37 image. Start and stop go through the `android` CLI, which blocks until the device
# is actually ready or gone.
[tasks.avd]
description = "Create the 'shear' AVD if missing"
depends = ["sdk-emulator"]
run = "avdmanager list avd | grep -q 'Name: shear' || avdmanager create avd -n shear -d pixel_8 -k 'system-images;android-37.0;google_apis;arm64-v8a'"

[tasks.emulator]
description = "Boot the 'shear' AVD and return once it is ready"
depends = ["avd"]
run = "android emulator start shear"

[tasks.emulator-stop]
description = "Shut down the 'shear' AVD"
run = "android emulator stop shear"

[tasks.build]
description = "Assemble the debug APK"
run = "./gradlew assembleDebug"

[tasks.install]
description = "Install the debug APK on the connected device or emulator"
run = "./gradlew installDebug"

[tasks.run]
description = "Install and launch the app"
depends = ["install"]
run = "adb shell am start -n dev.gswizz.shear/.MainActivity"

[tasks.test]
description = "Run unit tests in all modules"
run = "./gradlew test"

# `fmt` mutates; `fmt-check` and `lint` only verify. Deliberately no task depends on `fmt`: a gate that silently
# fixes the thing it checks cannot fail.
[tasks.fmt]
description = "Format Kotlin, Gradle scripts, XML, markdown, and TOML"
run = ["./gradlew spotlessApply", "rumdl check --fix .", "taplo fmt"]

[tasks.fmt-check]
description = "Check formatting and license headers without writing"
run = ["./gradlew spotlessCheck", "rumdl check .", "taplo fmt --check"]

[tasks.lint]
description = "Android Lint, workflow lint, spelling"
run = ["./gradlew lint", "actionlint", "typos"]

[tasks.ci]
description = "Everything CI runs: format check, lint, test, build"
depends = ["fmt-check", "lint", "test", "build"]

# Brave's datasets are the only source of cleaning behavior. Snapshots are copied byte for byte from pinned upstream
# commits and never edited by hand; UPSTREAM records where they came from. The conditional trackers live in C++ in
# brave-core, so they are extracted from the source file into a small JSON object.
[tasks.rules-update]
description = "Refresh the Brave rule snapshots (clean-urls, debounce, query-filter, conditional trackers)"
run = """
set -euo pipefail
dir=core/src/main/resources/brave
lists=$(curl -fsSL https://api.github.com/repos/brave/adblock-lists/commits/master | sed -n 's/^  "sha": "\\(.*\\)",$/\\1/p')
core=$(curl -fsSL https://api.github.com/repos/brave/brave-core/commits/master | sed -n 's/^  "sha": "\\(.*\\)",$/\\1/p')
test -n "$lists" && test -n "$core"
for f in clean-urls.json debounce.json query-filter.json; do
  curl -fsSL "https://raw.githubusercontent.com/brave/adblock-lists/$lists/brave-lists/$f" -o "$dir/$f"
done
curl -fsSL "https://raw.githubusercontent.com/brave/brave-core/$core/components/query_filter/browser/utils.cc" \\
  | sed -n '/kConditionalQueryStringTrackers/,/});/p' \\
  | sed -n 's/^ *{"\\([A-Za-z0-9_]*\\)", "\\(.*\\)"},*$/\\1\t\\2/p' \\
  | sort \\
  | awk -F'\t' 'BEGIN { printf "{\\n" } { printf "%s  \\"%s\\": \\"%s\\"", (NR > 1 ? ",\\n" : ""), $1, $2 } END { printf "\\n}\\n" }' \\
  > "$dir/conditional-trackers.json"
grep -q '"mkt_tok"' "$dir/conditional-trackers.json"
printf 'adblock-lists: https://github.com/brave/adblock-lists\\nadblock-lists-commit: %s\\nbrave-core: https://github.com/brave/brave-core\\nbrave-core-commit: %s\\nfetched: %s\\nlicense: MPL-2.0\\n' \\
  "$lists" "$core" "$(date -u +%Y-%m-%d)" > "$dir/UPSTREAM"
"""

# Mozilla's Public Suffix List decides what "same site" means for debouncing, exactly as it does in Brave.
[tasks.psl-update]
description = "Refresh the Public Suffix List snapshot and record its checksum"
run = """
set -euo pipefail
dir=core/src/main/resources/mozilla
mkdir -p "$dir"
curl -fsSL https://publicsuffix.org/list/public_suffix_list.dat -o "$dir/public_suffix_list.dat"
printf 'source: https://publicsuffix.org/list/public_suffix_list.dat\\nfetched: %s\\nsha256: %s\\nlicense: MPL-2.0\\n' \\
  "$(date -u +%Y-%m-%d)" "$(shasum -a 256 "$dir/public_suffix_list.dat" | cut -d' ' -f1)" > "$dir/UPSTREAM"
"""

[tasks.clean]
description = "Remove Gradle build outputs"
run = "./gradlew clean"
