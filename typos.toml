# ref: https://github.com/crate-ci/typos/blob/master/docs/reference.md
[files]
# Vendored upstream data and generated wrapper scripts are not ours to spell-check.
extend-exclude = [
  "core/src/main/resources/brave/*.json",
  "core/src/main/resources/mozilla/*.dat",
  "core/src/test/resources/psl/*",
  "gradle/wrapper/**",
  "gradlew",
  "gradlew.bat",
]
